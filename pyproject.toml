[tool.poetry]
name = "knowledgator"
version = "0.0.1"
description = "Python client SDK for the Knowledgator API"
authors = ["Knowledgator <info@knowledgator.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://knowledgator.com"
repository = "https://github.com/knowledgator/knowledgator-sdk.py"
keywords = ["knowledgator", "sdk", "api", "client"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Internet :: WWW/HTTP :: HTTP Client",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/knowledgator/knowledgator-sdk.py/issues"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
httpx = ">=0.28.1"                 
pydantic = ">=2.10.3"                  

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
pre-commit = "^3.7.1"
coverage = "^7.5.3"

[tool.poetry.group.lint.dependencies]
ruff = "^0.4.5"
pyright = "^1.1.401"
mypy = "==1.15.0"
pylint = "==3.2.3"
